name: Reentrenamiento semanal

# Cada valor se entrena en su propio job, todos a la vez. En serie, diez valores
# son casi tres horas; en paralelo, lo que tarde el más lento (unos 20 minutos).
# GitHub permite 20 jobs simultáneos en repositorios públicos.

on:
  schedule:
    - cron: '0 6 * * 6'          # sábados, con el mercado cerrado
  workflow_dispatch:
    inputs:
      only:
        description: 'Tickers concretos separados por comas (vacío = todos)'
        type: string
      force:
        description: 'Reentrenar aunque los modelos sean recientes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reentrenamiento
  cancel-in-progress: false

jobs:
  # ── 1. Comprobar que el código está sano y preparar la lista ──────────────
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tickers: ${{ steps.lista.outputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Autodiagnóstico
        run: python -m alphaforge selftest      # si falla, no se entrena nada

      - name: Preparar la lista de valores
        id: lista
        run: |
          python - <<'EOF' >> $GITHUB_OUTPUT
          import json, os
          only = os.environ.get("ONLY", "").strip()
          if only:
              t = [x.strip().upper() for x in only.split(",") if x.strip()]
          else:
              t = json.load(open("universe.json"))["tickers"]
          print("tickers=" + json.dumps(t))
          EOF
        env:
          ONLY: ${{ inputs.only }}

  # ── 2. Un job por valor, todos en paralelo ───────────────────────────────
  entrenar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false           # que un valor falle no debe tumbar el resto
      max-parallel: 10
      matrix:
        ticker: ${{ fromJson(needs.preparar.outputs.tickers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Entrenar ${{ matrix.ticker }}
        run: |
          python scripts/train_all.py \
            --universe universe.json --out models \
            --only "${{ matrix.ticker }}" \
            --skip-fresh-days ${{ inputs.force && '0' || '5' }} \
            --part-out "part"

      - name: Guardar el trozo
        uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.ticker }}
          path: |
            part/summary.json
            models/*.pkl
            models/reports/*_oos.csv
          if-no-files-found: warn
          retention-days: 3

  # ── 3. Unir todo y publicar (un solo push, sin conflictos) ───────────────
  publicar:
    needs: entrenar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recoger los trozos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: parte-*
          merge-multiple: false

      - name: Colocar los modelos
        run: |
          mkdir -p models
          find artifacts -name '*.pkl' -exec cp {} models/ \;
          ls -la models/ || true

      - name: Consolidar
        run: python scripts/merge_site_data.py --parts artifacts --out docs/data --models models

      - name: Evaluar la cartera combinada
        continue-on-error: true
        run: |
          find artifacts -name '*_oos.csv' -exec cp {} models/reports/ \; 2>/dev/null || true
          python scripts/portfolio_eval.py --reports models/reports \
            --out docs/data/portfolio.json || echo "sin datos de cartera todavía"

      - name: Publicar
        run: |
          git config user.name  "alphaforge-bot"
          git config user.email "actions@github.com"
          git add models docs/data
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "modelos $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push && exit 0
            echo "reintento $i..."; sleep $((i * 5))
          done
          echo "::error::no se pudo publicar tras 3 intentos"; exit 1
